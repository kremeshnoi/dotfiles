theme = "jetbrains_dark_transparent"

[editor]
line-number = "relative"
true-color = true
end-of-line-diagnostics = "disable"
popup-border = "all"
gutters = ["diagnostics", "spacer", "line-numbers", "spacer", "diff"]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.lsp]
auto-signature-help = false
display-messages = true

[editor.statusline]
left = []
center = ["spinner", "file-name"]
right = ["diagnostics", "workspace-diagnostics"]

[editor.soft-wrap]
enable = true

[editor.whitespace.render]
space = "none"
tab = "all"
nbsp = "all"
newline = "none"

[editor.inline-diagnostics]
cursor-line = "warning"
other-lines = "warning"
