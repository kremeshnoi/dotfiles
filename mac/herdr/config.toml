onboarding = false

[keys]
previous_tab = "alt+h"
next_tab = "alt+l"
previous_agent = "alt+shift+k"
next_agent = "alt+shift+j"
previous_workspace = "alt+k"
next_workspace = "alt+j"
focus_pane_left = "alt+shift+h"
focus_pane_right = "alt+shift+l"

[[keys.command]]
key = "alt+shift+f"
type = "popup"
command = "~/.local/bin/herdr-goto"
width = "80%"
height = "70%"
description = "goto"

[[keys.command]]
key = "alt+shift+n"
type = "plugin_action"
command = "kremeshnoi.nvim-sessions.toggle"
description = "nvim sessions"

[[keys.command]]
key = "alt+shift+r"
type = "shell"
command = "~/.local/bin/herdr-git-review"
description = "review diff"

[ui.sound]
enabled = false

[theme]
name = "vesper"
auto_switch = false

[theme.custom]
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "reset"
selection_bg = "reset"

[ui]
tab_bar_position = "bottom"
host_cursor = "native"
show_agent_labels_on_pane_borders = true

[experimental]
switch_ascii_input_source_in_prefix = true
