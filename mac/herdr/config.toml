onboarding = false

[keys]
previous_tab = "alt+h"
next_tab = "alt+l"
previous_agent = "alt+shift+k"
next_agent = "alt+shift+j"
previous_workspace = "alt+k"
next_workspace = "alt+j"

[ui.sound]
enabled = false

[theme]
name = "vesper"
auto_switch = false

[ui]
host_cursor = "native"
show_agent_labels_on_pane_borders = true

[experimental]
switch_ascii_input_source_in_prefix = true
