general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: true

gaps:
  scale_with_dpi: true
  inner_gap: '8px'
  outer_gap:
    top: '8px'
    right: '8px'
    bottom: '8px'
    left: '8px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#3f3f42'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '95%'
  other_windows:
    border:
      enabled: false
      color: '#1f2220'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '100%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  - name: '1-desktop'
    display_name: 'desktop'
    keep_alive: true
  - name: '2-system'
    display_name: 'system'
    keep_alive: true
  - name: '3-terminal'
    display_name: 'terminal'
    keep_alive: true
  - name: '4-browser'
    display_name: 'browser'
    keep_alive: true
  - name: '6-obsidian'
    display_name: 'obsidian'
    keep_alive: true
  - name: '7-docker'
    display_name: 'docker'
    keep_alive: true
  - name: '9-spotify'
    display_name: 'spotify'
    keep_alive: true
  - name: '10-discord'
    display_name: 'discord'
    keep_alive: true
  - name: '11-telegram'
    display_name: 'telegram'
    keep_alive: true
  - name: '12-eve'
    display_name: 'eve'
    keep_alive: true
  - name: '14-misc'
    display_name: 'misc'
    keep_alive: true

window_rules:
  - commands: ['ignore']
    match:
      - window_process: { regex: '(?i)^(zebar|raycast|usernotificationcenter|scshost|logi options\+|endpointconnect|endpoint security)$' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }

  - commands: ['set-tiling', 'move --workspace 3-terminal', 'focus --workspace 3-terminal']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^optimum$' }

  - commands: ['move --workspace 4-browser', 'focus --workspace 4-browser']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^(zen)$' }

  - commands: ['move --workspace 6-obsidian', 'focus --workspace 6-obsidian']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^(obsidian)$' }

  - commands: ['move --workspace 7-docker', 'focus --workspace 7-docker']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^(docker desktop)$' }

  - commands: ['set-tiling', 'move --workspace 9-spotify', 'focus --workspace 9-spotify']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^(spotify)$' }

  - commands: ['move --workspace 10-discord', 'focus --workspace 10-discord']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^(discord)$' }

  - commands: ['move --workspace 11-telegram', 'focus --workspace 11-telegram']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^(telegram)$' }

  - commands: ['move --workspace 12-eve', 'focus --workspace 12-eve']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^(eve online|eve|evelauncher)$' }

  - commands: ['move --workspace 2-system', 'focus --workspace 2-system']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^(finder|system settings|activity monitor|preview|calculator|disk utility|app store|archive utility|keychain access|console|font book|image capture|screenshot|textedit|system information)$' }

  - commands: ['move --workspace 14-misc', 'focus --workspace 14-misc']
    on: ['manage']
    match:
      - window_process: { not_regex: '(?i)^(optimum|zen|obsidian|docker desktop|spotify|discord|telegram|eve online|eve|evelauncher|finder|system settings|activity monitor|preview|calculator|disk utility|app store|archive utility|keychain access|console|font book|image capture|screenshot|textedit|system information|zebar|raycast|usernotificationcenter|scshost|logi options\+|endpointconnect|endpoint security)$' }

binding_modes:
  - name: 'resize'
    keep_alive: true
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['lwin+ctrl+left']
      - commands: ['resize --width +2%']
        bindings: ['lwin+ctrl+right']
      - commands: ['resize --height +2%']
        bindings: ['lwin+ctrl+up']
      - commands: ['resize --height -2%']
        bindings: ['lwin+ctrl+down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape']

keybindings:
  - commands: ['focus --workspace 1-desktop']
    bindings: ['lwin+shift+0']
  - commands: ['focus --workspace 2-system']
    bindings: ['lwin+shift+y']
  - commands: ['focus --workspace 3-terminal']
    bindings: ['lwin+shift+t']
  - commands: ['focus --workspace 4-browser']
    bindings: ['lwin+shift+b']
  - commands: ['focus --workspace 6-obsidian']
    bindings: ['lwin+shift+n']
  - commands: ['focus --workspace 7-docker']
    bindings: ['lwin+shift+c']
  - commands: ['focus --workspace 9-spotify']
    bindings: ['lwin+shift+s']
  - commands: ['focus --workspace 10-discord']
    bindings: ['lwin+shift+x']
  - commands: ['focus --workspace 11-telegram']
    bindings: ['lwin+shift+m']
  - commands: ['focus --workspace 12-eve']
    bindings: ['lwin+shift+e']
  - commands: ['focus --workspace 14-misc']
    bindings: ['lwin+shift+9']

  - commands: ['focus --prev-active-workspace']
    bindings: ['lwin+shift+h']

  - commands: ['move --workspace 1-desktop', 'focus --workspace 1-desktop']
    bindings: ['ctrl+shift+lwin+0']
  - commands: ['move --workspace 2-system', 'focus --workspace 2-system']
    bindings: ['ctrl+shift+lwin+y']
  - commands: ['move --workspace 3-terminal', 'focus --workspace 3-terminal']
    bindings: ['ctrl+shift+lwin+t']
  - commands: ['move --workspace 4-browser', 'focus --workspace 4-browser']
    bindings: ['ctrl+shift+lwin+b']
  - commands: ['move --workspace 6-obsidian', 'focus --workspace 6-obsidian']
    bindings: ['ctrl+shift+lwin+n']
  - commands: ['move --workspace 7-docker', 'focus --workspace 7-docker']
    bindings: ['ctrl+shift+lwin+c']
  - commands: ['move --workspace 9-spotify', 'focus --workspace 9-spotify']
    bindings: ['ctrl+shift+lwin+s']
  - commands: ['move --workspace 10-discord', 'focus --workspace 10-discord']
    bindings: ['ctrl+shift+lwin+x']
  - commands: ['move --workspace 11-telegram', 'focus --workspace 11-telegram']
    bindings: ['ctrl+shift+lwin+m']
  - commands: ['move --workspace 12-eve', 'focus --workspace 12-eve']
    bindings: ['ctrl+shift+lwin+e']
  - commands: ['move --workspace 14-misc', 'focus --workspace 14-misc']
    bindings: ['ctrl+shift+lwin+9']

  - commands: ['focus --next-active-workspace']
    bindings: ['lwin+shift+l']
  - commands: ['wm-cycle-focus']
    bindings: ['lwin+ctrl+n']

  - commands: ['focus --direction left']
    bindings: ['lwin+ctrl+h']
  - commands: ['focus --direction right']
    bindings: ['lwin+ctrl+l']
  - commands: ['focus --direction up']
    bindings: ['lwin+ctrl+k']
  - commands: ['focus --direction down']
    bindings: ['lwin+ctrl+j']

  - commands: ['move --direction left']
    bindings: ['lwin+ctrl+shift+h']
  - commands: ['move --direction right']
    bindings: ['lwin+ctrl+shift+l']
  - commands: ['move --direction up']
    bindings: ['lwin+ctrl+shift+k']
  - commands: ['move --direction down']
    bindings: ['lwin+ctrl+shift+j']

  - commands: ['shell-exec /bin/bash -c $HOME/.glzr/glazewm/kill-workspace.sh']
    bindings: ['lwin+shift+q']
  - commands: ['toggle-fullscreen']
    bindings: ['lwin+ctrl+a']
  - commands: ['toggle-floating --centered']
    bindings: ['lwin+ctrl+f']
  - commands: ['toggle-tiling-direction']
    bindings: ['lwin+ctrl+v']
  - commands: ['toggle-tiling']
    bindings: ['lwin+ctrl+shift+v']
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['lwin+ctrl+r']
  - commands: ['shell-exec /usr/bin/open -na Optimum']
    bindings: ['lwin+enter']
  - commands: ['wm-reload-config']
    bindings: ['lwin+ctrl+shift+r']
  - commands: ['wm-redraw']
    bindings: ['lwin+ctrl+w']
  - commands: ['wm-toggle-pause']
    bindings: ['lwin+ctrl+p']
  - commands: ['wm-exit']
    bindings: ['lwin+ctrl+e']
