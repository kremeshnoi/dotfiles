onboarding = false

[keys]
previous_tab = "alt+h"
next_tab = "alt+l"
previous_agent = "alt+shift+k"
next_agent = "alt+shift+j"
previous_workspace = "alt+k"
next_workspace = "alt+j"
focus_pane_left = "alt+shift+h"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "alt+shift+l"

[ui.sound]
enabled = false

[theme]
name = "vesper"
auto_switch = false

[theme.custom]
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#262626"
selection_bg = "#333333"

[ui]
tab_bar_position = "bottom"
host_cursor = "native"
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
status_indicators = "symbols"

[experimental]
switch_ascii_input_source_in_prefix = true
