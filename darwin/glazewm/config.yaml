general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: true

gaps:
  scale_with_dpi: true
  inner_gap: '8px'
  outer_gap:
    top: '8px'
    right: '8px'
    bottom: '8px'
    left: '8px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#3f3f42'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '95%'
  other_windows:
    border:
      enabled: false
      color: '#1f2220'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '100%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  - name: '1-desktop'
    display_name: 'desktop'
    keep_alive: true
  - name: '2-system'
    display_name: 'system'
    keep_alive: true
  - name: '3-term'
    display_name: 'term'
    keep_alive: true
  - name: '4-edge'
    display_name: 'edge'
    keep_alive: true
  - name: '5-claude'
    display_name: 'claude'
    keep_alive: true
  - name: '6-slack'
    display_name: 'slack'
    keep_alive: true
  - name: '7-obsidian'
    display_name: 'obsidian'
    keep_alive: true
  - name: '8-docker'
    display_name: 'docker'
    keep_alive: true
  - name: '9-tabularis'
    display_name: 'tabularis'
    keep_alive: true
  - name: '10-misc'
    display_name: 'misc'
    keep_alive: true

window_rules:
  - commands: ['ignore']
    match:
      - window_process: { regex: '(?i)^(zebar|raycast|usernotificationcenter|scshost|logi options\+|endpointconnect|endpoint security)$' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }

  - commands: ['set-tiling', 'move --workspace 3-term', 'focus --workspace 3-term']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^ghostty$' }

  - commands: ['move --workspace 4-edge', 'focus --workspace 4-edge']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^microsoft edge$' }

  - commands: ['move --workspace 5-claude', 'focus --workspace 5-claude']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^claude$' }

  - commands: ['move --workspace 6-slack', 'focus --workspace 6-slack']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^slack$' }

  - commands: ['move --workspace 7-obsidian', 'focus --workspace 7-obsidian']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^obsidian$' }

  - commands: ['move --workspace 8-docker', 'focus --workspace 8-docker']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^docker desktop$' }

  - commands: ['move --workspace 9-tabularis', 'focus --workspace 9-tabularis']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^tabularis$' }

  - commands: ['move --workspace 2-system', 'focus --workspace 2-system']
    on: ['manage']
    match:
      - window_process: { regex: '(?i)^(finder|system settings|activity monitor|preview|calculator|disk utility|app store|archive utility|keychain access|console|font book|image capture|screenshot|textedit|system information)$' }

  - commands: ['move --workspace 10-misc', 'focus --workspace 10-misc']
    on: ['manage']
    match:
      - window_process: { not_regex: '(?i)^(tabularis|ghostty|microsoft edge|claude|slack|obsidian|docker desktop|finder|system settings|activity monitor|preview|calculator|disk utility|app store|archive utility|keychain access|console|font book|image capture|screenshot|textedit|system information|zebar|raycast|usernotificationcenter|scshost|logi options\+|endpointconnect|endpoint security)$' }

binding_modes:
  - name: 'resize'
    keep_alive: true
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['lwin+ctrl+left']
      - commands: ['resize --width +2%']
        bindings: ['lwin+ctrl+right']
      - commands: ['resize --height +2%']
        bindings: ['lwin+ctrl+up']
      - commands: ['resize --height -2%']
        bindings: ['lwin+ctrl+down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape']

keybindings:
  - commands: ['focus --workspace 1-desktop']
    bindings: ['lwin+shift+0']
  - commands: ['focus --workspace 2-system']
    bindings: ['lwin+shift+y']
  - commands: ['focus --workspace 3-term']
    bindings: ['lwin+shift+t']
  - commands: ['focus --workspace 4-edge']
    bindings: ['lwin+shift+b']
  - commands: ['focus --workspace 5-claude']
    bindings: ['lwin+shift+a']
  - commands: ['focus --workspace 6-slack']
    bindings: ['lwin+shift+m']
  - commands: ['focus --workspace 7-obsidian']
    bindings: ['lwin+shift+n']
  - commands: ['focus --workspace 8-docker']
    bindings: ['lwin+shift+c']
  - commands: ['focus --workspace 9-tabularis']
    bindings: ['lwin+shift+d']
  - commands: ['focus --workspace 10-misc']
    bindings: ['lwin+shift+9']

  - commands: ['focus --prev-active-workspace']
    bindings: ['lwin+shift+h']

  - commands: ['move --workspace 1-desktop', 'focus --workspace 1-desktop']
    bindings: ['ctrl+shift+lwin+0']
  - commands: ['move --workspace 2-system', 'focus --workspace 2-system']
    bindings: ['ctrl+shift+lwin+y']
  - commands: ['move --workspace 3-term', 'focus --workspace 3-term']
    bindings: ['ctrl+shift+lwin+t']
  - commands: ['move --workspace 4-edge', 'focus --workspace 4-edge']
    bindings: ['ctrl+shift+lwin+b']
  - commands: ['move --workspace 5-claude', 'focus --workspace 5-claude']
    bindings: ['ctrl+shift+lwin+a']
  - commands: ['move --workspace 6-slack', 'focus --workspace 6-slack']
    bindings: ['ctrl+shift+lwin+m']
  - commands: ['move --workspace 7-obsidian', 'focus --workspace 7-obsidian']
    bindings: ['ctrl+shift+lwin+n']
  - commands: ['move --workspace 8-docker', 'focus --workspace 8-docker']
    bindings: ['ctrl+shift+lwin+c']
  - commands: ['move --workspace 9-tabularis', 'focus --workspace 9-tabularis']
    bindings: ['ctrl+shift+lwin+d']
  - commands: ['move --workspace 10-misc', 'focus --workspace 10-misc']
    bindings: ['ctrl+shift+lwin+9']

  - commands: ['focus --next-active-workspace']
    bindings: ['lwin+shift+l']
  - commands: ['wm-cycle-focus']
    bindings: ['lwin+ctrl+n']

  - commands: ['focus --direction left']
    bindings: ['lwin+ctrl+h']
  - commands: ['focus --direction right']
    bindings: ['lwin+ctrl+l']
  - commands: ['focus --direction up']
    bindings: ['lwin+ctrl+k']
  - commands: ['focus --direction down']
    bindings: ['lwin+ctrl+j']

  - commands: ['move --direction left']
    bindings: ['lwin+ctrl+shift+h']
  - commands: ['move --direction right']
    bindings: ['lwin+ctrl+shift+l']
  - commands: ['move --direction up']
    bindings: ['lwin+ctrl+shift+k']
  - commands: ['move --direction down']
    bindings: ['lwin+ctrl+shift+j']

  - commands: ['shell-exec /bin/bash /Users/oleksandr.kremeshnoi/.glzr/glazewm/kill-workspace.sh']
    bindings: ['lwin+shift+q']
  - commands: ['toggle-fullscreen']
    bindings: ['lwin+ctrl+a']
  - commands: ['toggle-floating --centered']
    bindings: ['lwin+ctrl+f']
  - commands: ['toggle-tiling-direction']
    bindings: ['lwin+ctrl+v']
  - commands: ['toggle-tiling']
    bindings: ['lwin+ctrl+shift+v']
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['lwin+ctrl+r']
  - commands: ['shell-exec /usr/bin/open -na Ghostty']
    bindings: ['lwin+enter']
  - commands: ['wm-reload-config']
    bindings: ['lwin+ctrl+shift+r']
  - commands: ['wm-redraw']
    bindings: ['lwin+ctrl+w']
  - commands: ['wm-toggle-pause']
    bindings: ['lwin+ctrl+p']
  - commands: ['wm-exit']
    bindings: ['lwin+ctrl+e']
